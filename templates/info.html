<!DOCTYPE html>
<html>
<head>
    <title>Daily Nutrition Log</title>
</head>
<body>
    <h1>Nutrition Summary</h1>
    <ul>
        <!-- Loops directly through your JSON keys and values -->
        {% for key, value in nutrition_data.items() %}
            <li><strong>{{ key }}:</strong> {{ value | round(1) }}</li>
        {% endfor %}
    </ul>
    
    <br>
    <a href="/">Back to Home</a>
</body>
</html>
